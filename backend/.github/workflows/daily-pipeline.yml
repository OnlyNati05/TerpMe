name: Daily UMD Pipeline

on:
  # Lets you click "Run workflow" manually.
  workflow_dispatch:

  # Runs once every day.
  schedule:
    - cron: "17 10 * * *"

permissions:
  contents: read

concurrency:
  group: daily-umd-pipeline
  cancel-in-progress: false

jobs:
  run-pipeline:
    name: Crawl and index pages
    runs-on: ubuntu-latest

    # Stops a stuck job after 30 minutes.
    timeout-minutes: 30

  env:
    NODE_ENV: production

    DATABASE_URL: ${{ secrets.DATABASE_URL }}

    QDRANT_URL: postgresql://neondb_owner:npg_Ksyzj2fTRbk8@ep-flat-morning-adjxlp76-pooler.c-2.us-east-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require?connect_timeout=0?pool_timeout=0
    QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
    QDRANT_COLLECTION_NAME: umd_docs
    QDRANT_VECTOR_SIZE: 1536
    QDRANT_DISTANCE: Cosine

    OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    OPENAI_EMBEDDING_MODEL: text-embedding-3-small
    OPENAI_CHAT_MODEL: gpt-5.6-luna

    FRONTEND_URL: https://terrpme.com

    steps:
      - name: Download repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run daily pipeline
        run: npm run pipeline
