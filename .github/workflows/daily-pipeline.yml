name: Daily UMD Pipeline

on:
  workflow_dispatch:

  schedule:
    # Every day at 10:17 UTC
    # 6:17 AM EDT / 5:17 AM EST
    - cron: "17 10 * * *"

permissions:
  contents: read

concurrency:
  group: daily-umd-pipeline
  cancel-in-progress: false

jobs:
  run-pipeline:
    name: Crawl and index pages
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: backend

    env:
      NODE_ENV: production

      DATABASE_URL: ${{ secrets.DATABASE_URL }}

      QDRANT_URL: ${{ secrets.QDRANT_URL }}
      QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
      QDRANT_COLLECTION_NAME: ${{ vars.QDRANT_COLLECTION_NAME }}
      QDRANT_VECTOR_SIZE: ${{ vars.QDRANT_VECTOR_SIZE }}
      QDRANT_DISTANCE: ${{ vars.QDRANT_DISTANCE }}

      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_EMBEDDING_MODEL: ${{ vars.OPENAI_EMBEDDING_MODEL }}
      OPENAI_CHAT_MODEL: ${{ vars.OPENAI_CHAT_MODEL }}

      FRONTEND_URL: ${{ vars.FRONTEND_URL }}

    steps:
      - name: Download repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: backend/.nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run daily pipeline
        run: npm run pipeline
